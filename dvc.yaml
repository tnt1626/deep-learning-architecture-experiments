stages:
  prepare_data:
    cmd: python src/data_prep.py
    deps:
      - data/raw
      - src/data_prep.py
    params:
      - base.use_augmented
    outs:
      - data/processed

  train:
    cmd: python src/train.py
    deps:
      - data/processed
      - src/model.py
      - src/train.py
    params:
      - base.seed
      - base.epochs
      - base.batch_size
      - base.learning_rate
    outs:
      - models/model.pth
    plots:
      - training_log.csv:
          x: epoch

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - models/model.pth
      - data/processed
      - src/evaluate.py
    params:
      - base.batch_size
    metrics:
      - metrics.json:
          cache: false
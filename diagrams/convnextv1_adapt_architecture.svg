<svg width="100%" viewBox="0 0 680 260" role="img" xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc">
  <title id="title">ConvNeXt v1 Adapted Architecture</title>
  <desc id="desc">CIFAR-10 adapted ConvNeXt v1 with a 3x3 stride-1 stem, four stages, straight horizontal transitions, and a global average pooling classifier head.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .block-label { fill: rgb(194, 192, 182); font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; text-anchor: middle; }
      .legend { fill: rgb(194, 192, 182); font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; }
      .box-dark { fill: rgb(60, 52, 137); stroke: rgb(175, 169, 236); stroke-width: 0.5px; }
      .box-head { fill: rgb(113, 43, 19); stroke: rgb(240, 153, 123); stroke-width: 0.5px; }
      .text-dark { fill: rgb(206, 203, 246); font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; }
      .text-mid { fill: rgb(175, 169, 236); font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; text-anchor: middle; }
      .text-head { fill: rgb(245, 196, 179); font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; font-weight: 500; text-anchor: middle; }
      .text-head-small { fill: rgb(240, 153, 123); font-family: "Anthropic Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; font-weight: 400; text-anchor: middle; }
      .arrow { fill: none; stroke: rgb(156, 154, 146); stroke-width: 1.5px; }
      .skip { fill: none; stroke: rgb(127, 119, 221); stroke-width: 1.2px; opacity: 0.7; }
    </style>
  </defs>

  <title>ConvNeXt v1 Adapted Architecture</title>
  <desc>CIFAR-10 adapted ConvNeXt v1 with a 3x3 stride-1 stem, four stages, straight horizontal transitions, and a global average pooling classifier head.</desc>

  <text x="340" y="22" class="block-label">ConvNeXt v1 Adapted</text>
  <text x="60" y="22" class="block-label">Input 3×32×32</text>

  <g>
    <rect x="40" y="35" width="84" height="108" rx="8" class="box-dark"/>
    <text x="82" y="61" class="text-dark">Stem</text>
    <text x="82" y="79" class="text-mid">Conv 3×3</text>
    <text x="82" y="96" class="text-mid">s=1, 96 ch</text>
    <text x="82" y="113" class="text-mid">LN + NHWC</text>
    <text x="82" y="130" class="text-mid">32×32</text>
  </g>

  <g>
    <rect x="138" y="35" width="84" height="108" rx="8" class="box-dark"/>
    <text x="180" y="61" class="text-dark">Stage 1</text>
    <text x="180" y="79" class="text-mid">2 blocks</text>
    <text x="180" y="96" class="text-mid">96 ch</text>
    <text x="180" y="113" class="text-mid">DW 7×7</text>
    <text x="180" y="130" class="text-mid">32×32</text>
  </g>

  <g>
    <rect x="236" y="35" width="84" height="108" rx="8" class="box-dark"/>
    <text x="278" y="61" class="text-dark">Stage 2</text>
    <text x="278" y="79" class="text-mid">Downsample</text>
    <text x="278" y="96" class="text-mid">96→192</text>
    <text x="278" y="113" class="text-mid">2 blocks</text>
    <text x="278" y="130" class="text-mid">16×16</text>
  </g>

  <g>
    <rect x="334" y="35" width="84" height="108" rx="8" class="box-dark"/>
    <text x="376" y="61" class="text-dark">Stage 3</text>
    <text x="376" y="79" class="text-mid">Downsample</text>
    <text x="376" y="96" class="text-mid">192→384</text>
    <text x="376" y="113" class="text-mid">6 blocks</text>
    <text x="376" y="130" class="text-mid">8×8</text>
  </g>

  <g>
    <rect x="432" y="35" width="84" height="108" rx="8" class="box-dark"/>
    <text x="474" y="61" class="text-dark">Stage 4</text>
    <text x="474" y="79" class="text-mid">Downsample</text>
    <text x="474" y="96" class="text-mid">384→768</text>
    <text x="474" y="113" class="text-mid">2 blocks</text>
    <text x="474" y="130" class="text-mid">4×4</text>
  </g>

  <g>
    <rect x="530" y="35" width="100" height="108" rx="8" class="box-head"/>
    <text x="580" y="61" class="text-head">Head</text>
    <text x="580" y="79" class="text-head-small">GAP + LN</text>
    <text x="580" y="96" class="text-head-small">Linear 10</text>
    <text x="580" y="113" class="text-head-small">logits</text>
    <text x="580" y="130" class="text-head-small">classify</text>
  </g>

  <line x1="124" y1="89" x2="138" y2="89" class="arrow" marker-end="url(#arrow)"/>
  <line x1="222" y1="89" x2="236" y2="89" class="arrow" marker-end="url(#arrow)"/>
  <line x1="320" y1="89" x2="334" y2="89" class="arrow" marker-end="url(#arrow)"/>
  <line x1="418" y1="89" x2="432" y2="89" class="arrow" marker-end="url(#arrow)"/>
  <line x1="516" y1="89" x2="530" y2="89" class="arrow" marker-end="url(#arrow)"/>

  <path d="M82 35 Q82 24 95 24 Q108 24 124 35" class="skip" marker-end="url(#arrow)"/>
  <path d="M180 35 Q180 24 193 24 Q206 24 222 35" class="skip" marker-end="url(#arrow)"/>
  <path d="M278 35 Q278 24 291 24 Q304 24 320 35" class="skip" marker-end="url(#arrow)"/>
  <path d="M376 35 Q376 24 389 24 Q402 24 418 35" class="skip" marker-end="url(#arrow)"/>
  <path d="M474 35 Q474 24 487 24 Q500 24 516 35" class="skip" marker-end="url(#arrow)"/>

  <text x="340" y="174" class="legend" text-anchor="middle">DW 7×7 → LN → 1×1 expand ×4 → GELU → 1×1 reduce → residual</text>
  <text x="340" y="193" class="legend" text-anchor="middle">All transitions are LN + stride-2 conv; DropPath defaults to 0</text>
  <text x="340" y="212" class="legend" text-anchor="middle">Stage depths: [2, 2, 6, 2]   Dims: [96, 192, 384, 768]</text>
</svg>
